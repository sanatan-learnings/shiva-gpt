chapter-01-shloka-01:
  devanagari: शौनक उवाच । हे हे सूत महाप्राज्ञ सर्वसिद्धान्तवित् प्रभो । आख्याहि मे कथासारं पुराणानां विशेषतः ॥ १॥
chapter-01-shloka-02:
  devanagari: सदाचारश्च सद्भक्तिर्विवेको वर्धते कथम् । स्वविकारनिरासश्च सज्जनैः क्रियते कथम् ॥ २॥
chapter-01-shloka-03:
  devanagari: जीवाश्चासुरतां प्राप्ताः प्रायो घोरे कलाविह । तस्य संशोधने किं हि विद्यते परमायनम् ॥ ३॥
chapter-01-shloka-04:
  devanagari: यदस्ति वस्तु परमं श्रेयसां श्रेय उत्तमम् । पावनं पावनानां च साधनं तद्वदाधुना ॥ ४॥
chapter-01-shloka-05:
  devanagari: येन तत्साधनेनाशु शुध्यत्यात्मा विशेषतः । शिवप्राप्तिर्भवेत्तात सदा निर्मलचेतसः ॥ ५॥
chapter-01-shloka-06:
  devanagari: सूत उवाच । धन्यस्त्वं मुनिशार्दूल श्रवणप्रीतिलालसः । अतो विचार्य सुधिया वच्मि शास्त्रं महोत्तमम् ॥ ६॥
chapter-01-shloka-07:
  devanagari: सर्वसिद्धान्तनिष्पन्नं भक्त्यादिकविवर्धनम् । शिवतोषकरं दिव्यं श‍ृणु वत्स रसायनम् ॥ ७॥
chapter-01-shloka-08:
  devanagari: कालव्यालमहात्रासविध्वंसकरमुत्तमम् । शैवं पुराणं परमं शिवेनोक्तं पुरा मुने ॥ ८॥
chapter-01-shloka-09:
  devanagari: सनत्कुमारस्य मुनेरुपदेशात् परादरात् । व्यासेनोक्तं तु सङ्क्षेपात् कलिजानां हिताय च ॥ ९॥
chapter-01-shloka-10:
  devanagari: एतस्मादपरं किञ्चित्पुराणाच्छैवतो मुने । न विद्यते मनःशुद्ध्यै कलिजानां विशेषतः ॥ १०॥
chapter-01-shloka-11:
  devanagari: जन्मान्तरे भवेत् पुण्यं महद्यस्य सुधीमतः । तस्य प्रीतिर्भवेत्तत्र महाभाग्यवतो मुने ॥ ११॥
chapter-01-shloka-12:
  devanagari: एतच्छिवपुराणं हि परमं शास्त्रमुत्तमम् । शिवरूपं क्षितौ ज्ञेयं सेवनीयं च सर्वथा ॥ १२॥
chapter-01-shloka-13:
  devanagari: पठनाच्छ्रवणादस्य भक्तिमान्नरसत्तमः । सद्यः शिवपदप्राप्तिं लभते सर्वसाधनात् ॥ १३॥
chapter-01-shloka-14:
  devanagari: तस्मात् सर्वप्रयत्नेन काङ्क्षितं पठनं नृभिः । तथास्य श्रवणं प्रेम्णा सर्वकामफलप्रदम् ॥ १४॥
chapter-01-shloka-15:
  devanagari: पुराणश्रवणाच्छम्भोर्निष्पापो जायते नरः । भुक्त्वा भोगान् सुविपुलान् शिवलोकमवाप्नुयात् ॥ १५॥
chapter-01-shloka-16:
  devanagari: राजसूयेन यत्पुण्यमग्निष्टोमशतेन च । तत् पुण्यं लभते शम्भोः कथाश्रवणमात्रतः ॥ १६॥
chapter-01-shloka-17:
  devanagari: ये श‍ृण्वन्ति मुने शैवं पुराणं शास्त्रमुत्तमम् । ते मनुष्या न मन्तव्या रुद्रा एव न संशयः ॥ १७॥
chapter-01-shloka-18:
  devanagari: श‍ृण्वतां तत् पुराणं हि तथा कीर्तयतां च तत् । पादाम्बुजरजांस्येव तीर्थानि मुनयो विदुः ॥ १८॥
chapter-01-shloka-19:
  devanagari: गन्तुं निःश्रेयसं स्थानं येऽभिवाञ्छन्ति देहिनः । शैवं पुराणममलं भक्त्या श‍ृण्वन्तु ते सदा ॥ १९॥
chapter-01-shloka-20:
  devanagari: सदा श्रोतुं यद्यशक्तो भवेत् स मुनिसत्तम । नियतात्मा प्रतिदिनं श‍ृणुयाद्वा मुहूर्तकम् ॥ २०॥
chapter-01-shloka-21:
  devanagari: यदि प्रतिदिनं श्रोतुमशक्तो मानवो भवेत् । पुण्यमासादिषु मुने श‍ृणुयाच्छिवपुराणकम् ॥ २१॥
chapter-01-shloka-22:
  devanagari: मुहूर्तं वा तदर्धं वा तदर्धं वा क्षणं च वा । ये श‍ृण्वन्ति पुराणं तन्न तेषां दुर्गर्तिर्भवेत् ॥ २२॥
chapter-01-shloka-23:
  devanagari: तत्पुराणं च श‍ृण्वानः पुरुषो यो मुनीश्वर । स निस्तरति संसारं दग्ध्वा कर्ममहाटवीम् ॥ २३॥
chapter-01-shloka-24:
  devanagari: यत्पुण्यं सर्वदानेषु सर्वयज्ञेषु वा मुने । शम्भोः पुराणश्रवणात्तत्फलं निश्चलं भवेत् ॥ २४॥
chapter-01-shloka-25:
  devanagari: विशेषतः कलौ शैवपुराणश्रवणादृते । परो धर्मो न पुंसां हि मुक्तिसाधनकृन्मुने ॥ २५॥
chapter-01-shloka-26:
  devanagari: पुराणश्रवणं शम्भोर्नामसङ्कीर्तनं तथा । कल्पद्रुमफलं सम्यङ् मनुष्याणां न संशयः ॥ २६॥
chapter-01-shloka-27:
  devanagari: कलौ दुर्मेधसां पुंसां धर्माचारोज्झितात्मनाम् । हिताय विदधे शम्भुः पुराणाख्यं सुधारसम् ॥ २७॥
chapter-01-shloka-28:
  devanagari: एकोऽजरामरः स्याद्वै पिबन्नेवामृतं पुमान् । शम्भोः कथामृतं कुर्यात् कुलमेवाजरामरम् ॥ २८॥
chapter-01-shloka-29:
  devanagari: सदा सेव्या सदा सेव्या सदा सेव्या विशेषतः । एतच्छिवपुराणस्य कथा परमपावनि ॥ २९॥
chapter-01-shloka-30:
  devanagari: एतच्छिवपुराणस्य कथाश्रवणमात्रतः । किं ब्रवीमि फलं तस्य शिवश्चित्तं समाश्रयेत् ॥ ३०॥
chapter-01-shloka-31:
  devanagari: चतुर्विंशतिसाहस्रो ग्रन्थोऽयं सप्तसंहितः । भक्तित्रिकसुसम्पूर्णः श‍ृणुयात्तं परादरात् ॥ ३१॥
chapter-01-shloka-32:
  devanagari: विद्येश्वरसंहिताद्या द्वितीया रुद्रसंहिता । तृतीया शतरुद्राख्या कोटिरुद्रा चतुर्थिका ॥ ३२॥
chapter-01-shloka-33:
  devanagari: पञ्चम्युमासंहितोक्ता षष्ठी कैलाससंहिता । सप्तमी वायवीयाख्या सप्तैवं संहिता इह ॥ ३३॥
chapter-01-shloka-34:
  devanagari: ससप्तसंहितं दिव्यं पुराणं शिवसंज्ञकम् । वरीवर्ति ब्रह्मतुल्यं सर्वोपरि गतिप्रदम् ॥ ३४॥
chapter-01-shloka-35:
  devanagari: एतच्छिवपुराणं हि सप्तसंहितमादरात् । परिपूर्णं पठेद्यस्तु स जीवन्मुक्त उच्यते ॥ ३५॥
chapter-01-shloka-36:
  devanagari: पुमानज्ञानतस्तावद् भ्रमतेऽस्मिन्भवे मुने । यावत्कर्णगतं नास्ति पुराणं शैवमुत्तमम् ॥ ३६॥
chapter-01-shloka-37:
  devanagari: किं श्रुतैर्बहुभिः शास्त्रैः पुराणैश्च भ्रमावहैः । शैवं पुराणमेकं हि मुक्तिदानेन गर्जति ॥ ३७॥
chapter-01-shloka-38:
  devanagari: एतच्छिवपुराणस्य कथा भवति यद्गृहे । तीर्थभूतं हि तद् गेहं वसतां पापनाशनम् ॥ ३८॥
chapter-01-shloka-39:
  devanagari: अश्वमेधसहस्राणि वाजपेयशतानि च । कलां शिवपुराणस्य नार्हन्ति खलु षोडशीम् ॥ ३९॥
chapter-01-shloka-40:
  devanagari: तावत् स प्रोच्यते पापी पापकृन्मुनिसत्तम । यावच्छिवपुराणं हि न श‍ृणोति सुभक्तितः ॥ ४०॥
chapter-01-shloka-41:
  devanagari: गङ्गाद्याः पुण्यनद्यश्च सप्तपुर्यो गया तथा । एतच्छिवपुराणस्य समतां यान्ति न क्वचित् ॥ ४१॥
chapter-01-shloka-42:
  devanagari: नित्यं शिवपुराणस्य श्लोकंश्लोकार्धमेव च । स्वमुखेन पठेद्भक्त्या यदीच्छेत् परमां गतिम् ॥ ४२॥
chapter-01-shloka-43:
  devanagari: एतच्छिवपुराणं यो वाचयेदर्थतोऽनिशम् । पठेद्वा प्रीतितो नित्यं स पुण्यात्मा न संशयः ॥ ४३॥
chapter-01-shloka-44:
  devanagari: अन्तकाले हि यश्चैनं श‍ृणुयाद्भक्तितः सुधीः । सुप्रसन्नो महेशानस्तस्मै यच्छति स्वं पदम् ॥ ४४॥
chapter-01-shloka-45:
  devanagari: एतच्छिवपुराणं यः पूजयेन्नित्यमादरात् । स भुक्त्वेहाखिलान् कामानन्ते शिवपदं लभेत् ॥ ४५॥
chapter-01-shloka-46:
  devanagari: एतच्छिवपुराणस्य कुर्वन्नित्यमतन्द्रितः । पट्टवस्त्रादिना सम्यक् सत्कारं स सुखी सदा ॥ ४६॥
chapter-01-shloka-47:
  devanagari: शैवं पुराणममलं शैवसर्वस्वमादरात् । सेवनीयं प्रयत्नेन परत्रेह सुखेप्सुना ॥ ४७॥
chapter-01-shloka-48:
  devanagari: चतुर्वर्गप्रदं शैवं पुराणममलं परम् । श्रोतव्यं सर्वदा प्रीत्या पठितव्यं विशेषतः ॥ ४८॥
chapter-01-shloka-49:
  devanagari: वेदेतिहासशास्त्रेषु परं श्रेयस्करं महत् । शैवं पुराणं विज्ञेयं सर्वथा हि मुमुक्षुभिः ॥ ४९॥
chapter-01-shloka-50:
  devanagari: शैवं पुराणमिदमात्मविदां वरिष्ठं सेव्यं सदा परमवस्तु सता समर्च्यम् । तापत्रयाभिशमनं सुखदं सदैव प्राणप्रियं विधिहरीशमुखामराणाम् ॥ ५०॥
chapter-01-shloka-51:
  devanagari: वन्दे शिवपुराणं हि सर्वदाहं प्रसन्नधीः । शिवः प्रसन्नतां यायाद् दद्यात्स्वपदयो रतिम् ॥ ५१॥
chapter-01-shloka-52:
  devanagari: इति श्रीस्कान्दे महापुराणे शिवपुराणमाहात्म्ये तन्महिमवर्णनं नाम प्रथमोऽध्यायः ॥ ०.१॥
chapter-02-shloka-01:
  devanagari: शौनक उवाच । सूत सूत महाभाग धन्यस्त्वं परमार्थवित् । अद्भुतेयं कथा दिव्या श्राविता कृपया हि नः ॥ १॥
chapter-02-shloka-02:
  devanagari: अघौघविध्वंसकरी मनःशुद्धिविधायिनि । शिवसन्तोषजननी कथेयं नः श्रुताद्भुता ॥ २॥
chapter-02-shloka-03:
  devanagari: एतत्कथासमानं न भुवि किञ्चित् परात्परम् । निश्चयेनेति विज्ञातमस्माभिः कृपया तव ॥ ३॥
chapter-02-shloka-04:
  devanagari: के के विशुध्यन्त्यनया कथया पापिनः कलौ । वद तान् कृपया सूत कृतार्थं भुवनं कुरु ॥ ४॥
chapter-02-shloka-05:
  devanagari: सूत उवाच । ये मानवाः पापकृतो दुराचाररताः खलाः । कामादिनिरता नित्यं तेऽपि शुध्यन्त्यनेन वै ॥ ५॥
chapter-02-shloka-06:
  devanagari: ज्ञानयज्ञः परोऽयं वै भुक्तिमुक्तिप्रदः सदा । शोधनः सर्वपापानां शिवसन्तोषकारकः ॥ ६॥
chapter-02-shloka-07:
  devanagari: तृष्णाकुलाः सत्यहीनाः पितृमातृविदूषकाः । दाम्भिका हिंसका ये च तेऽपि शुध्यन्त्यनेन वै ॥ ७॥
chapter-02-shloka-08:
  devanagari: स्ववर्णाश्रमधर्मेभ्यो वर्जिता मत्सरान्विताः । ज्ञानयज्ञेन तेऽनेन सम्पुनन्ति कलावपि ॥ ८॥
chapter-02-shloka-09:
  devanagari: छलच्छद्मकरा ये च ये च क्रूराः सुनिर्दयाः । ज्ञानयज्ञेन तेऽनेन सम्पुनन्ति कलावपि ॥ ९॥
chapter-02-shloka-10:
  devanagari: ब्रह्मस्वपुष्टाः सततं व्यभिचाररताश्च ये । ज्ञानयज्ञेन तेऽनेन सम्पुनन्ति कलावपि ॥ १०॥
chapter-02-shloka-11:
  devanagari: सदा पापरता ये च ये शठाश्च दुराशयाः । ज्ञानयज्ञेन तेऽनेन सम्पुनन्ति कलावपि ॥ ११॥
chapter-02-shloka-12:
  devanagari: मलिना दुर्धियोऽशान्ता देवताद्रव्यभोजिनः । ज्ञानयज्ञेन तेऽनेन सम्पुनन्ति कलावपि ॥ १२॥
chapter-02-shloka-13:
  devanagari: पुराणस्यास्य पुण्यं सन्महापातकनाशनम् । भुक्तिमुक्तिप्रदं चैव शिवसन्तोषहेतुकम् ॥ १३॥
chapter-02-shloka-14:
  devanagari: अत्रैवोदाहरन्तीममितिहासं पुरातनम् । यस्य श्रवणमात्रेण पापहानिर्भवत्यलम् ॥ १४॥
chapter-02-shloka-15:
  devanagari: आसीत् किरातनगरे ब्राह्मणो ज्ञानदुर्बलः । दरिद्रो रसविक्रेता वेदधर्मपराङ्मुखः ॥ १५॥
chapter-02-shloka-16:
  devanagari: सन्ध्यास्नानपरिभ्रष्टो वैश्यवृतिपरायणः । देवराज इति ख्यातो विश्र्वस्तजनवञ्चकः ॥ १६॥
chapter-02-shloka-17:
  devanagari: स विप्रान् क्षत्रियान् वैश्यान् शूद्रांश्चापि तथापरान् । हत्वा नानामिषेणैव तत्तद्धनमपाहरत् ॥ १७॥
chapter-02-shloka-18:
  devanagari: अधर्माद् बहुवित्तानि पश्चात्तेनार्जितानि वै । न धर्माय धनं तस्य स्वल्पञ्चापीह पापिनः ॥ १८॥
chapter-02-shloka-19:
  devanagari: एकदैकतडागे स स्नातुं यातो महीसुरः । वेश्यां शोभावतीं नाम दृष्ट्वा तत्रातिविह्वलः ॥ १९॥
chapter-02-shloka-20:
  devanagari: स्ववशं धनिनं विप्रं ज्ञात्वा हृष्टाथ सुन्दरी । वार्तालापेन तच्चित्तं प्रीतिमत्समजायत ॥ २०॥
chapter-02-shloka-21:
  devanagari: स्त्रियं कर्तुं स तां मेने पतिं कर्तुं च सा तथा । एवं कामवशौ भूत्वा बहुकालं विजह्रतुः ॥ २१॥
chapter-02-shloka-22:
  devanagari: आसने शयने पाने भोजने क्रीडने तथा । दम्पतीव सदा द्वौ तु ववृताते परस्परम् ॥ २२॥
chapter-02-shloka-23:
  devanagari: मात्रा पित्रा तथा पत्न्या वारितोऽपि पुनः पुनः । नामन्यत वचस्तेषां पापवृत्तिपरायणः ॥ २३॥
chapter-02-shloka-24:
  devanagari: एकदेर्ष्यावशाद् रात्रौ मातरं पितरं वधूम् । प्रसुप्तान् न्यवधीद् दुष्टो धनं तेषां तथाहरत् ॥ २४॥
chapter-02-shloka-25:
  devanagari: आत्मनीनं धनं यच्च पित्रादीनां तथा धनम् । वेश्यायै दत्तवान् सर्वं कामी तद्गतमानसः ॥ २५॥
chapter-02-shloka-26:
  devanagari: सोऽभक्ष्यभक्षकः पापी मदिरापानलालसः । एकपात्रे सदाभौक्षीत् सवेश्यो ब्राह्मणाधमः ॥ २६॥
chapter-02-shloka-27:
  devanagari: कदाचिद्दैवयोगेन प्रतिष्ठानमुपागतः । शिवालयं ददर्शासौ तत्र साधुजनावृतम् ॥ २७॥
chapter-02-shloka-28:
  devanagari: स्थित्वा तत्र च विप्रोऽसौ ज्वरेणातिप्रपीडितः । शुश्राव सततं शैवीं कथां विप्रमुखोद्गताम् ॥ २८॥
chapter-02-shloka-29:
  devanagari: देवराजश्च मासान्ते ज्वरेणापीडितो मृतः । बद्धो यमभटैः पाशैर्नीतो यमपुरं बलात् ॥ २९॥
chapter-02-shloka-30:
  devanagari: तावच्छिवगणाः शुभ्रास्त्रिशूलाञ्चितपाणयः । भस्मभासितसर्वाङ्गा रुद्राक्षाञ्चितविग्रहाः ॥ ३०॥
chapter-02-shloka-31:
  devanagari: शिवलोकात् समागत्य क्रुद्धा यमपुरीं ययुः । ताडयित्वा तु तद्दूतांस्तर्जयित्वा पुनः पुनः ॥ ३१॥
chapter-02-shloka-32:
  devanagari: देवराजं समामोच्य विमाने परमाद्भुते । उपवेश्य यदा दूताः कैलासं गन्तुमुत्सुकाः ॥ ३२॥
chapter-02-shloka-33:
  devanagari: तदा यमपुरीमध्ये महाकोलाहलोऽभवत् । धर्मराजस्तु तं श्रुत्वा स्वालयाद् बहिरागमत् ॥ ३३॥
chapter-02-shloka-34:
  devanagari: दृष्ट्वाथा चतुरो दूतान् साक्षाद् रुद्रानिवापरान् । पूजयामास धर्मज्ञो धर्मराजो यथाविधि ॥ ३४॥
chapter-02-shloka-35:
  devanagari: ज्ञानेन चक्षुषा सर्वं वृत्तान्तं ज्ञातवान् यमः । न भयात् पृष्टवान् किञ्चिच्छम्भोर्दूतान् महात्मनः ॥ ३५॥
chapter-02-shloka-36:
  devanagari: पूजिताः प्रार्थितास्ते वै कैलासमगमंस्तदा । ददुः शिवाय साम्बाय तं दयावारिराशये ॥ ३६॥
chapter-02-shloka-37:
  devanagari: धन्या शिवपुराणस्य कथा परमपावानी । यस्याः श्रवणमात्रेण पापीयानपि मुक्तिभाक् ॥ ३७॥
chapter-02-shloka-38:
  devanagari: सदाशिवमहास्थानं परं धाम परं पदम् । यदाहुर्वेदविद्वांसः सर्वलोकोपरि स्थितम् ॥ ३८॥
chapter-02-shloka-39:
  devanagari: ब्राह्मणाः क्षत्रिया वैश्याः शूद्रा अन्येऽपि प्राणिनः । हिंसिता धनलोभेन बहवो येन पापिना ॥ ३९॥
chapter-02-shloka-40:
  devanagari: मातृपितृवधूहन्ता वेश्यागामी च मद्यपः । देवराजो द्विजस्तत्र गत्वा मुक्तोऽभवत् क्षणात् ॥ ४०॥
chapter-02-shloka-41:
  devanagari: इति श्रीस्कान्दे महापुराणे शिवपुराणमाहात्म्ये देवराजमुक्तिवर्णनं नाम द्वितीयोऽध्यायः ॥ ०.२॥
chapter-03-shloka-01:
  devanagari: शौनक उवाच । सूत सूत महाभाग सर्वज्ञोऽसि महामते । त्वत्प्रसादात् कृतार्थोऽहं कृतार्थोऽहं पुनः पुनः ॥ १॥
chapter-03-shloka-02:
  devanagari: इतिहासमिमं श्रुत्वा मनो मेऽतीव मोदते । अन्यामपि कथां शम्भोर्वद प्रेमविवर्धिनीम् ॥ २॥
chapter-03-shloka-03:
  devanagari: नामृतं पिबतां लोके मुक्तिः क्वापि सभाज्यते । शम्भोः कथासुधापानं प्रत्यक्षं मुक्तिदायकम् ॥ ३॥
chapter-03-shloka-04:
  devanagari: धन्या धन्या कथा शम्भोस्त्वं धन्यो धन्य एव च । यदाकर्णनमात्रेण शिवलोकं व्रजेन्नरः ॥ ४॥
chapter-03-shloka-05:
  devanagari: सूत उवाच । श‍ृणु शौनक वक्ष्यामि त्वदग्रे गुह्यमप्युत । यतस्त्वं शिवभक्तानामग्रणीर्वेदवित्तमः ॥ ५॥
chapter-03-shloka-06:
  devanagari: समुद्रनिकटे देशे ग्रामो बाष्कलसंज्ञकः । वसन्ति यत्र पापिष्ठा वेदधर्मोज्झिता जनाः ॥ ६॥
chapter-03-shloka-07:
  devanagari: दुष्टा दुर्विषयात्मानो निर्दैवा जिह्मवृत्तयः । कृषीवलाः शस्त्रधराः परस्त्रीभोगिनः खलाः ॥ ७॥
chapter-03-shloka-08:
  devanagari: ज्ञानवैराग्यसद्धर्मं न जानन्ति परं हि ते । कुकथाश्रवणाढ्येषु निरताः पशुबुद्धयः ॥ ८॥
chapter-03-shloka-09:
  devanagari: अन्ये वर्णाश्च कुधियः स्वधर्मविमुखाः खलाः । कुकर्मनिरता नित्यं सदा विषयिणश्च ते ॥ ९॥
chapter-03-shloka-10:
  devanagari: स्त्रियः सर्वाश्च कुटिलाः स्वैरिण्यः पापलालसाः । कुधियो व्यभिचारिण्यः सद्वृत्ताचारवर्जिताः ॥ १०॥
chapter-03-shloka-11:
  devanagari: एवं कुजनसंवासे ग्रामे बाष्कलसंज्ञिते । तत्रैको बिन्दुगो नाम विप्र आसीन्महाधमः ॥ ११॥
chapter-03-shloka-12:
  devanagari: स दुरात्मा महापापी सुदारोऽपि कुमार्गगः । वेश्यापतिर्बभूवाथ कामाकुलितमानसः ॥ १२॥
chapter-03-shloka-13:
  devanagari: स्वपत्नीं चञ्चुलां नाम हित्वा नित्यं सुधर्मिणीम् । रेमे स वेश्यया दुष्टः स्मरबाणप्रपीडितः ॥ १३॥
chapter-03-shloka-14:
  devanagari: एवं कालो व्यतीयाय महांस्तस्य कुकर्मिणः । सा स्वधर्मभयात् क्लेशात् स्मरार्तापि च चञ्चुला ॥ १४॥
chapter-03-shloka-15:
  devanagari: अथ तस्याङ्गना सापि प्ररूढनवयौवना । अविषह्यस्मरावेशा स्वधर्माद्विरराम ह ॥ १५॥
chapter-03-shloka-16:
  devanagari: जारेण सङ्गता रात्रौ रेमे पापेन गुप्ततः । पतिदृष्टिं वञ्चयित्वा भ्रष्टसत्त्वा कुमार्गगा ॥ १६॥
chapter-03-shloka-17:
  devanagari: कदाचित्तां दुराचारां स्वपत्निं चञ्चुलां मुने । जारेण सङ्गतां रात्रौ ददर्श स्मरविह्वलाम् ॥ १७॥
chapter-03-shloka-18:
  devanagari: दृष्ट्वा तां दूषितां पत्नीं कुकर्मासक्तमानसाम् । जारेण सङ्गतां रात्रौ क्रोधाद् दुद्राव वेगतः ॥ १८॥
chapter-03-shloka-19:
  devanagari: तमागतं गृहे दुष्टमाज्ञाय बिन्दुगं खलः । पलायितो द्रुतं जारो वेगतश्छद्मवान् स वै ॥ १९॥
chapter-03-shloka-20:
  devanagari: अथ स बिन्दुगः पत्नीं गृहीत्वा सुदुराशयः । मुष्टिबन्धेन सन्तर्ज्य पुनः पुनरताडयत् ॥ २०॥
chapter-03-shloka-21:
  devanagari: सा नारी ताडिता भर्त्रा चञ्चुला स्वैरिणी खला । कुपिता निर्भया प्राह स्वपतिं बिन्दुगं खलम् ॥ २१॥
chapter-03-shloka-22:
  devanagari: चञ्चुलोवाच । भवान् प्रतिदिनं कामं रमते वेश्यया कुधीः । मां विहाय स्वप्त्नीं च युवतीं पतिसेविनीम् ॥ २२॥
chapter-03-shloka-23:
  devanagari: रूपवत्या युवत्याश्च कामाकुलितचेतसः । विना पतिविहारं स्यात् का गतिर्मे भवान् वदेत् ॥ २३॥
chapter-03-shloka-24:
  devanagari: अहं महारूपवती नवयौवनविह्वला । कथं सहे कामदुःखं तव सङ्गं विनार्तधीः ॥ २४॥
chapter-03-shloka-25:
  devanagari: सूत उवाच । इत्युक्तः स तया मूर्खो मूढधीर्ब्राह्मणोऽधमः । प्रोवाच बिन्दुगः पापी स्वधर्मविमुखः खलः ॥ २५॥
chapter-03-shloka-26:
  devanagari: बिन्दुग उवाच । सत्यमेतत्त्वयोक्तं हि कामव्याकुलचेतसा । हितं वक्ष्यामि तस्मात्ते श‍ृणु कान्ते भयं त्यज ॥ २६॥
chapter-03-shloka-27:
  devanagari: जारैर्विहर नित्यं त्वं चेतसा निर्भयेन वै । धनमाकर्ष तेभ्यो हि दत्त्वा तेभ्यः परां रतिम् ॥ २७॥
chapter-03-shloka-28:
  devanagari: तद्धनं देहि सर्वं मे वेश्यासंसक्तचेतसः । महत्स्वार्थं भवेन्नूनं तवापि च ममापि च ॥ २८॥
chapter-03-shloka-29:
  devanagari: सूत उवाच । इति भर्तृवचः श्रुत्वा चञ्चुला तद्वधूश्च सा । तथेति भर्तृवचनं प्रतिजग्राह हृष्टधीः ॥ २९॥
chapter-03-shloka-30:
  devanagari: कृत्वैवं समयं तौ वै दम्पती दुष्टमानसौ । कुकर्मनिरतौ जातौ निर्भयेन कुचेतसा ॥ ३०॥
chapter-03-shloka-31:
  devanagari: एवं तयोस्तु दम्पत्योर्दुराचारप्रवृत्तयोः । महान् कालो व्यतीयाय निष्फलो मूढचेतसोः ॥ ३१॥
chapter-03-shloka-32:
  devanagari: अथ विप्रः स कुमतिर्बिन्दुगो वृषलीपतिः । कालेन निधनं प्राप्तो जगाम नरकं खलः ॥ ३२॥
chapter-03-shloka-33:
  devanagari: भुक्त्वा नरकदुःखानि बह्वहानि स मूढधीः । विन्ध्येऽभवत् पिशाचो हि गिरौ पापी भयङ्करः ॥ ३३॥
chapter-03-shloka-34:
  devanagari: मृते भर्तरि तस्मिन्वै दुराचारेऽथ बिन्दुगे । उवास स्वगृहे पुत्रैश्चिरकालं विमूढधीः ॥ ३४॥
chapter-03-shloka-35:
  devanagari: एवं विहरती जारैः सा नारी चञ्चुलाह्वया । आसीत् कामरता प्रीता किञ्चिदुत्क्रान्तयौवना ॥ ३५॥
chapter-03-shloka-36:
  devanagari: एकदा दैवयोगेन सम्प्राप्ते पुण्यपर्वणि । सा नारी बन्धुभिः सार्धं गोकर्णं क्षेत्रमाययौ ॥ ३६॥
chapter-03-shloka-37:
  devanagari: प्रसङ्गात् सा तदा गत्वा कस्मिंश्चित् तीर्थपाथसि । सस्नौ सामान्यतो यत्र तत्र बभ्राम बन्धुभिः ॥ ३७॥
chapter-03-shloka-38:
  devanagari: देवालयेऽथ कस्मिंश्चिद्दैवज्ञमुखतः शुभाम् । शुश्राव सत्कथां शम्भोः पुण्यां पौराणिकीं च सा ॥ ३८॥
chapter-03-shloka-39:
  devanagari: योषितां जारसक्तानां नरके यमकिङ्कराः । सन्तप्तलोहपरिघं क्षिपन्ति स्मरमन्दिरे ॥ ३९॥
chapter-03-shloka-40:
  devanagari: इति पौराणिकेनोक्तां श्रुत्वा वैराग्यवर्धिनीम् । कथामासीद्भयोद्विग्ना चकम्पे तत्र सा च वै ॥ ४०॥
chapter-03-shloka-41:
  devanagari: कथा समाप्तौ सा नारी निर्गतेषु जनेषु च । भीता रहसि तं प्राह शैवं संवाचकं द्विजम् ॥ ४१॥
chapter-03-shloka-42:
  devanagari: चञ्चुलोवाच । ब्रह्मन् त्वं श‍ृण्वसद्वृत्तमजानन्त्या स्वधर्मकम् । श्रुत्वा मामुद्धर स्वामिन् कृपां कृत्वातुलामपि ॥ ४२॥
chapter-03-shloka-43:
  devanagari: चरितं सूल्बणं पापं मया मूढधिया प्रभो । नीतं पौंश्चल्यतः सर्वं यौवनं मदनान्धया ॥ ४३॥
chapter-03-shloka-44:
  devanagari: श्रुत्वेदं वचनं तेऽद्य वैराग्यरसजृम्भितम् । जाता महाभया साहं सकम्पात्तवियोगिका ॥ ४४॥
chapter-03-shloka-45:
  devanagari: धिङ् मां मूढधियं पापां काममोहितचेतसम् । निन्द्यां दुर्विषयासक्तां विमुखीं हि स्वधर्मतः ॥ ४५॥
chapter-03-shloka-46:
  devanagari: यदल्पस्य सुखस्यार्थे स्वकार्यस्य विनाशिनम् । महापापं कृतं घोरमजानन्त्यातिकष्टदम् ॥ ४६॥
chapter-03-shloka-47:
  devanagari: यास्यामि दुर्गतिं कां कां घोरां हा कष्टदायिनीम् । को ज्ञो यास्यति मां तत्र कुमार्गरतमानसाम् ॥ ४७॥
chapter-03-shloka-48:
  devanagari: मरणे यमदूताँस्तान् कथं द्रक्ष्ये भयङ्करान् । कथं पाशैर्बलात् कण्ठे बध्यमाना धृतिं लभे ॥ ४८॥
chapter-03-shloka-49:
  devanagari: कथं सहिष्ये नरके खण्डशो देहकृन्तनम् । यातनां तत्र महतीं दुःखदां च विशेषतः ॥ ४९॥
chapter-03-shloka-50:
  devanagari: दिवा चेष्टामिन्द्रियाणां कथं प्राप्स्यामि शोचती । रात्रौ कथं लभिष्येऽहं निद्रां दुःखपरिप्लुता ॥ ५०॥
chapter-03-shloka-51:
  devanagari: हा हतास्मि च दग्धास्मि विदीर्णहृदयास्मि च । सर्वथाहं विनष्टास्मि पापिनी सर्वथाप्यहम् ॥ ५१॥
chapter-03-shloka-52:
  devanagari: हा विधे मां महापापे दत्त्वा दुश्शेमुषीं हठात् । अपैति यत् स्वधर्माद्वै सर्वसौख्यकरादहो ॥ ५२॥
chapter-03-shloka-53:
  devanagari: शूलप्रोतस्य शैलाग्रात्पततस्तुङ्गतो द्विज । यद्दुःखं देहिनो घोरं तस्मात् कोटिगुणं मम ॥ ५३॥
chapter-03-shloka-54:
  devanagari: अश्वमेधशतं कृत्वा गङ्गां स्नात्वा शतं समाः । न शुद्धिर्जायते प्रायो मत्पापस्य गरीयसः ॥ ५४॥
chapter-03-shloka-55:
  devanagari: किं करोमि क्व गच्छामि कं वा शरणमाश्रये । कस्त्रायते मां लोकेऽस्मिन् पतन्तीं नरकार्णवे ॥ ५५॥
chapter-03-shloka-56:
  devanagari: त्वमेव मे गुरुर्ब्रह्मंस्त्वं माता त्वं पितासि च । उद्धरोद्धर मां दीनां त्वामेव शरणं गताम् ॥ ५६॥
chapter-03-shloka-57:
  devanagari: सूत उवाच । इति सञ्जातनिर्वेदां पतितां चरणद्वये । उत्थाप्य कृपया धीमान् बभाषे ब्राह्मणः स हि ॥ ५७॥
chapter-03-shloka-58:
  devanagari: इति श्रीस्कान्दे महापुराणे शिवपुराणमाहात्म्ये चञ्चुलावैराग्यवर्णनं नाम तृतीयोऽध्यायः ॥ ०.३॥
chapter-04-shloka-01:
  devanagari: ब्राह्मण उवाच । दिष्ट्या काले प्रबुद्धासि शिवानुग्रहतो वराम् । इमां शिवपुराणस्य श्रुत्वा वैराग्यवत्कथाम् ॥ १॥
chapter-04-shloka-02:
  devanagari: मा भैषीर्द्विजपत्नि त्वं शिवस्य शरणं व्रज । शिवानुग्रहतः सर्वं पापं सद्यो विनश्यति ॥ २॥
chapter-04-shloka-03:
  devanagari: वक्ष्यामि ते परं वस्तु शिवकीर्तिसमन्वितम् । भविष्यति गतिर्येन सर्वदा ते सुखावहा ॥ ३॥
chapter-04-shloka-04:
  devanagari: सत्कथाश्रवणादेव जाता ते मतिरीदृशी । पश्चात्तापान्विता शुद्धा वैराग्यं विषयेषु च ॥ ४॥
chapter-04-shloka-05:
  devanagari: पश्चात्तापः पापकृतां पापानां निष्कृतिः परा । सर्वेषां वर्णितं सद्भिः सर्वपापविशोधनम् ॥ ५॥
chapter-04-shloka-06:
  devanagari: पश्चात्तापेनैव शुद्धिः प्रायश्चित्तं करोति सः । यथोपदिष्टं सद्भिर्हि सर्वपापविशोधनम् ॥ ६॥
chapter-04-shloka-07:
  devanagari: प्रायश्चित्तमधीकृत्य विधिवन्निर्भयः पुमान् । न याति सुगतिं प्रायः पश्चात्तापी न संशयः ॥ ७॥
chapter-04-shloka-08:
  devanagari: एतच्छिवपुराणस्य कथाश्रवणतो यथा । जायते चित्तशुद्धिर्हि न तथान्यैरुपायतः ॥ ८॥
chapter-04-shloka-09:
  devanagari: शोध्यमानं दर्पणं हि यथा भवति निर्मलम् । तथैतत्कथया चेतो विशुद्धिं यात्यसंशयम् ॥ ९॥
chapter-04-shloka-10:
  devanagari: विशुद्धे चेतसि शिवो नृणां तिष्ठति साम्बिकः । ततो याति विशुद्धात्मा साम्बशम्भोः परं पदम् ॥ १०॥
chapter-04-shloka-11:
  devanagari: अतः सर्वस्य वर्गस्यैतत्कथासाधनं मतम् । एतदर्थं महादेवो निर्ममे त्वाग्रहादिमाम् ॥ ११॥
chapter-04-shloka-12:
  devanagari: कथया सिध्यति ध्यानमनया गिरिजापतेः । ध्यानाज्ज्ञानं परं तस्मात् कैवल्यं भवति ध्रुवम् ॥ १२॥
chapter-04-shloka-13:
  devanagari: असिद्धशङ्करध्यानः कथामेव श‍ृणोति यः । स प्राप्यान्यभवे ध्यानं शम्भोर्याति परां गतिम् ॥ १३॥
chapter-04-shloka-14:
  devanagari: एतत्कथाश्रवणतः कृत्वा ध्यानमुमापतेः । ते पश्चात्तापिनः पापा बहवः सिद्धिमागताः ॥ १४॥
chapter-04-shloka-15:
  devanagari: सर्वेषां श्रेयसां बीजं सत्कथाश्रवणं नृणाम् । यथावर्त्म समाराध्यं भवबन्धगदापहम् ॥ १५॥
chapter-04-shloka-16:
  devanagari: कथाश्रवणतः शम्भोर्मननाच्च ततो हृदा । निदिध्यासनतश्चैव चित्तशुद्धिर्भवत्यलम् ॥ १६॥
chapter-04-shloka-17:
  devanagari: अतो भक्तिर्महेशस्य पुत्राभ्यां भवति ध्रुवम् । तदनुग्रहतो दिव्या ततो मुक्तिर्न संशयः ॥ १७॥
chapter-04-shloka-18:
  devanagari: तद्विहीनः पशुर्ज्ञेयो मायाबन्धनसक्तधीः । संसारबन्धनान्नैव मुक्तो भवति स ध्रुवम् ॥ १८॥
chapter-04-shloka-19:
  devanagari: अतो हि द्विजपत्नि त्वं विषयेभ्यो निवृत्तधीः । श‍ृणु शम्भोः कथां चैतां भक्त्या परमपावनीम् ॥ १९॥
chapter-04-shloka-20:
  devanagari: श‍ृण्वन्त्याः सत्कथामेतां शङ्करस्य परात्मनः । शुद्धिमेष्यति चेतस्ते ततो मुक्तिमवाप्स्यसि ॥ २०॥
chapter-04-shloka-21:
  devanagari: ध्यायतः शिवपादाब्जं चेतसा निर्मलेन वै । एकेन जन्मना मुक्तिः सत्यं सत्यं वदाम्यहम् ॥ २१॥
chapter-04-shloka-22:
  devanagari: सूत उवाच । इत्युक्त्वा स द्विजवरो वरः शैवः कृपार्द्रधीः । तूष्णीं बभूव शुद्धात्मा शिवध्यानपरायणः ॥ २२॥
chapter-04-shloka-23:
  devanagari: अथ बिन्दुगपत्नि सा चञ्चुलाह्वा प्रसन्नधीः । इत्युक्ता तेन विप्रेण समासीद्बाष्पलोचना ॥ २३॥
chapter-04-shloka-24:
  devanagari: पपातारं द्विजेन्द्रस्य पादयोस्तस्य हृष्टधीः । चञ्चुला साञ्जलिः सा च कृतार्थास्मीत्यभाषत ॥ २४॥
chapter-04-shloka-25:
  devanagari: अथ सोत्थाय सातङ्का साञ्जलिर्गद्गदाक्षरम् । तमुवाच महाशैवं द्विजं वैराग्ययुक् सुधीः ॥ २५॥
chapter-04-shloka-26:
  devanagari: चञ्चुलोवाच । ब्रह्मन् शैववर स्वामिन् धन्यस्त्वं परमार्थदृक् । परोपकारनिरतो वर्णनीयः सुसाधुषु ॥ २६॥
chapter-04-shloka-27:
  devanagari: उद्धरोद्धर मां साधो पतन्तीं नरकार्णवे । श्रुत्वा यां सुकथां शैवीं पुराणार्थविजृम्भिताम् ॥ २७॥
chapter-04-shloka-28:
  devanagari: विरक्तधीरहं जाता विषयेभ्यश्च सर्वतः । सुश्रद्धा महती ह्येतत्पुराणश्रवणेऽधुना ॥ २८॥
chapter-04-shloka-29:
  devanagari: सूत उवाच । इत्युक्त्वा साञ्जलिः सा वै सम्प्राप्य तदनुग्रहम् । तत्पुराणं श्रोतुकामातिष्ठत्तत्सेवने रता ॥ २९॥
chapter-04-shloka-30:
  devanagari: अथ शैववरो विप्रस्तस्मिन्नेव स्थले सुधीः । सत्कथां श्रावयामास तत्पुराणस्य तां स्त्रियम् ॥ ३०॥
chapter-04-shloka-31:
  devanagari: इत्थं तस्मिन् महाक्षेत्रे तस्मादेव द्विजोत्तमात् । कथां शिवपुराणस्य सा शुश्राव महोत्तमाम् ॥ ३१॥
chapter-04-shloka-32:
  devanagari: भक्तिज्ञानविरागाणां वर्धिनीं मुक्तिदायिनीम् । बभूव सुकृतार्था सा श्रुत्वा तां सत्कथां पराम् ॥ ३२॥
chapter-04-shloka-33:
  devanagari: सद्गुरोस्तस्य कृपया शुद्धचित्ता च सा द्रुतम् । शिवानुग्रहतः शम्भोः रूपध्यानमवाप ह ॥ ३३॥
chapter-04-shloka-34:
  devanagari: इत्थं सद्गुरुमाश्रित्य सा प्राप्तशिवसन्मतिः । दध्यौ मुहुर्मुहुः शम्भोश्चिदानन्दमयं वपुः ॥ ३४॥
chapter-04-shloka-35:
  devanagari: स्नात्वा तीर्थजले नित्यं जटावल्कलधारिणी । भस्मोद्धूलितसर्वाङ्गी रुद्राक्षकृतभूषणा ॥ ३५॥
chapter-04-shloka-36:
  devanagari: शिवनामजपासक्ता वाग्यता मितभोजना । गुरूपदिष्टमार्गेण सा शिवं समतोषयत् ॥ ३६॥
chapter-04-shloka-37:
  devanagari: एवं तस्याश्चञ्चुलायाः कुर्वन्त्या ध्यानमुत्तमम् । बहुकालो व्यतीयाय शम्भोस्तत्रैव शौनक ॥ ३७॥
chapter-04-shloka-38:
  devanagari: अथ कालेन पूर्णेन भक्तित्रिकसमन्विता । समुत्ससर्ज देहं स्वमनायासेन चञ्चुला ॥ ३८॥
chapter-04-shloka-39:
  devanagari: विमानं द्रुतमायान्तं प्रेषितं त्रिपुरारिणा । दिव्यं स्वगणसंयुक्तं नानाशोभासमन्वितम् ॥ ३९॥
chapter-04-shloka-40:
  devanagari: अथ तत्र समारूढा महेशानुचरैर्वरैः । नीता शिवपुरीं सद्यो ध्वस्तसर्वमला च सा ॥ ४०॥
chapter-04-shloka-41:
  devanagari: दिव्यरूपधरा दिव्या दिव्यावयवशालिनी । चन्द्रार्धशेखरा गौरी विलसद्दिव्यभूषणा ॥ ४१॥
chapter-04-shloka-42:
  devanagari: गत्वा तत्र महादेवं सा ददर्श त्रिलोचनम् । विष्णुब्रह्मादिभिर्देवैः सेव्यमानं सनातनम् ॥ ४२॥
chapter-04-shloka-43:
  devanagari: गणेशभृङ्गिनन्दीशवीरभद्रेश्वरादिभिः । उपास्यमानं सद्भक्त्या कोटिसूर्यसमप्रभम् ॥ ४३॥
chapter-04-shloka-44:
  devanagari: नीलग्रीवं पञ्चवक्त्रं त्र्यम्बकं चन्द्रशेखरम् । वामाङ्गे बिभ्रतं गौरीं विद्युत्पुञ्जसमप्रभाम् ॥ ४४॥
chapter-04-shloka-45:
  devanagari: कर्पूरगौरं गौरीशं सर्वालङ्कारधारिणम् । सितभस्मलसद्देहं सितवस्त्रं महोज्ज्वलम् ॥ ४५॥
chapter-04-shloka-46:
  devanagari: दृष्ट्वैवं शङ्करं नारी सा मुमोदाति चञ्चुला । सुसम्भ्रमान्महाप्रीता प्रणनाम पुनः पुनः ॥ ४६॥
chapter-04-shloka-47:
  devanagari: साञ्जलिः सा मुदा प्रेम्णा सन्तुष्टा च विनीतका । आनन्दाश्रुजलैर्युक्ता रोमहर्षसमन्विता ॥ ४७॥
chapter-04-shloka-48:
  devanagari: अथ सा वै करुणया पार्वत्या शङ्करेण च । समानीतोपकण्ठं हि सुदृष्ट्या च विलोकिता ॥ ४८॥
chapter-04-shloka-49:
  devanagari: पार्वत्या सा कृता प्रीत्या स्वसखी दिव्यरूपिणी । दिव्यसौख्यान्विता तत्र चञ्चुला बिन्दुगप्रिया ॥ ४९॥
chapter-04-shloka-50:
  devanagari: तस्मिँल्लोके परानन्दघनज्योतिषि शाश्वते । लब्ध्वा निवासमचलं लेभे सुखमनाहतम् ॥ ५०॥
chapter-04-shloka-51:
  devanagari: इति श्रीस्कान्दे महापुराणे शिवपुराणमाहात्म्ये चञ्चुलासद्गतिवर्णनं नाम चतुर्थोऽध्यायः ॥ ०.४॥
chapter-05-shloka-01:
  devanagari: शौनक उवाच । सूत सूत महाभाग धन्यस्त्वं शिवसक्तधीः । श्रावितेयं कथास्माकमद्भुता भक्तिवर्धिनी ॥ १॥
chapter-05-shloka-02:
  devanagari: तत्र गत्वा किं चकार चञ्चुला प्राप्तसद्गतिः । तत् त्वं वद विशेषेण तत्पतेश्च महामते ॥ २॥
chapter-05-shloka-03:
  devanagari: सूत उवाच । सा कदाचिदुमां देवीमुपगम्य प्रणम्य च । सुतुष्टाव करौ बद्ध्वा परमानन्दसम्प्लुता ॥ ३॥
chapter-05-shloka-04:
  devanagari: चञ्चुलोवाच । गिरिजे स्कन्दमातस्त्वं सेविता सर्वदा नरैः । सर्वासौख्यप्रदे शम्भुप्रिये ब्रह्मस्वरूपिणि ॥ ४॥
chapter-05-shloka-05:
  devanagari: विष्णुब्रह्मादिभिस्सेव्या सगुणा निर्गुणापि च । त्वमाद्या प्रकृतिस्सूक्ष्मा सच्चिदानन्दरूपिणी ॥ ५॥
chapter-05-shloka-06:
  devanagari: सृष्टिस्थितिलयकरी त्रिगुणा त्रिसुरालया । ब्रह्मविष्णुमहेशानां सुप्रतिष्ठाकरा परा ॥ ६॥
chapter-05-shloka-07:
  devanagari: सूत उवाच । इति स्तुत्वा महेशीं तां चञ्चुला प्राप्तसद्गतिः । विरराम नतस्कन्धा प्रेमपूर्णाश्रुलोचना ॥ ७॥
chapter-05-shloka-08:
  devanagari: ततः सा करुणाविष्टा पार्वती शङ्करप्रिया । तामुवाच महाप्रीत्या चञ्चुलां भक्तवत्सला ॥ ८॥
chapter-05-shloka-09:
  devanagari: पार्वत्युवाच । चञ्चुले सखि सुप्रीतानया स्तुत्यास्मि सुन्दरि । किं याचसे वरं ब्रूहि नादेयं विद्यते तव ॥ ९॥
chapter-05-shloka-10:
  devanagari: सूत उवाच । इत्युक्ता सा गिरिजया चञ्चुला सुप्रणम्य ताम् । पर्यपृच्छत सुप्रीत्या साञ्जलिर्नतमस्तका ॥ १०॥
chapter-05-shloka-11:
  devanagari: चञ्चुलोवाच । मम भर्ताधुना क्वास्ते नैव जानामि तद्गतिम् । तेन युक्ता यथाहं वै भवामि गिरिजेऽनघे ॥ ११॥
chapter-05-shloka-12:
  devanagari: तथैव कुरु कल्याणि कृपया दीनवत्सले । महादेवि महेशानि भर्ता मे वृषलीपतिः । मत्तः पूर्वं मृतः पापी न जाने कां गतिं गतः ॥ १२॥
chapter-05-shloka-13:
  devanagari: सूत उवाच । इत्याकणर्य वचस्तस्याश्चञ्चुलाया हि पार्वती । प्रत्युवाच सुसम्प्रीत्या गिरिजा नयवत्सला ॥ १३॥
chapter-05-shloka-14:
  devanagari: गिरिजोवाच । सूते भर्ता बिन्दुगाह्वो महापापी दुराशयः । वेश्याभोगी महामूढो मृत्वा स नरकं गतः ॥ १४॥
chapter-05-shloka-15:
  devanagari: भुक्त्वा नरकदुःखानि विविधान्यमिताः समाः । पापशेषेण पापात्मा विन्ध्ये जातः पिशाचकः ॥ १५॥
chapter-05-shloka-16:
  devanagari: इदानीं स पिशाचोऽस्ति नानाक्लेशसमन्वितः । तत्रैव वातभुग्दुष्टः सर्वकष्टवहः सदा ॥ १६॥
chapter-05-shloka-17:
  devanagari: सूत उवाच । इति गौर्या वचः श्रुत्वा चञ्चुला सा शुभव्रता । पतिदुःखेन महता दुःखितासीत्तदा किल ॥ १७॥
chapter-05-shloka-18:
  devanagari: समाधाय ततश्चित्तं सुप्रणम्य महेश्वरीम् । पुनः पप्रच्छ सा नारी हृदयेन विदूयता ॥ १८॥
chapter-05-shloka-19:
  devanagari: चञ्चुलोवाच । महेश्वरि महादेवि कृपां कुरु ममोपरि । समुद्धर पतिं मेऽद्य दुष्टकर्मकरं खलम् ॥ १९॥
chapter-05-shloka-20:
  devanagari: केनोपायेन मे भर्ता पापात्मा स कुबुद्धिमान् । सद्गतिं प्राप्नुयाद्देवि तद्वदाशु नमोऽस्तु ते ॥ २०॥
chapter-05-shloka-21:
  devanagari: सूत उवाच । इत्याकर्ण्य वचस्तस्याः पार्वती भक्तवत्सला । प्रत्युवाच प्रसन्नात्मा चञ्चुलां स्वसखिं च ताम् ॥ २१॥
chapter-05-shloka-22:
  devanagari: पार्वत्युवाच । श‍ृणुयाद्यदि ते भर्ता पुण्यां शिवकथां पराम् । निस्तीर्य दुर्गतिं सर्वां सद्गतिं प्राप्नुयादिति ॥ २२॥
chapter-05-shloka-23:
  devanagari: इति गौर्या वचः श्रुत्वामृताक्षरमथादरात् । कृताञ्जालिर्नतस्कन्धा प्रणनाम पुनः पुनः ॥ २३॥
chapter-05-shloka-24:
  devanagari: तत्कथाश्रवणं भर्तुः सर्वपापविशुद्धये । सद्गतिप्राप्तये चैव प्रार्थयामास तां तदा ॥ २४॥
chapter-05-shloka-25:
  devanagari: सूत उवाच । तया मुहुर्मुहुर्नार्या प्रार्थ्यमाना शिवप्रिया । गौरी कृपान्वितासीत् सा महेशी भक्तवत्सला ॥ २५॥
chapter-05-shloka-26:
  devanagari: अथ तुम्बुरुमाहूय शिवसत्कीर्तिगायकम् । प्रीत्या गन्धर्वराजं हि गिरिकन्येदमब्रवीत् ॥ २६॥
chapter-05-shloka-27:
  devanagari: गिरिजोवाच । हे तुम्बुरो शिवप्रीत मम मानसकारक । सहानया विन्ध्यशैलं भद्रं ते गच्छ सत्वरम् ॥ २७॥
chapter-05-shloka-28:
  devanagari: आस्ते तत्र महाघोरः पिशाचोऽतिभयङ्करः । तद्वृत्तं श‍ृणु सुप्रीत्यादितः सर्वं ब्रवीमि ते ॥ २८॥
chapter-05-shloka-29:
  devanagari: पुराभवे पिशाचः स बिन्दुगाह्वोऽभवद् द्विजः । अस्या नार्याः पतिर्दुष्टो मत्सख्या वृषलीपतिः ॥ २९॥
chapter-05-shloka-30:
  devanagari: स्नानसन्ध्याक्रियाहीनोऽशौचः क्रोधविमूढधीः । दुर्भक्षी सज्जनद्वेषी दुष्परिग्रहकारकः ॥ ३०॥
chapter-05-shloka-31:
  devanagari: हिंसकः शस्त्रधारी च सव्यहस्तेन भोजनी । दीनानां पीडकः क्रूरः परवेश्मप्रदीपकः ॥ ३१॥
chapter-05-shloka-32:
  devanagari: चाण्डालाभिरतो नित्यं वेश्याभोगी महाखलः । स्वपत्नित्यागकृत् पापी दुष्टसङ्गरतस्तदा ॥ ३२॥
chapter-05-shloka-33:
  devanagari: तेन वेश्याकुसङ्गेन सुकृतं नाशितं महत् । वित्तलोभेन महिषी निर्भया जारिणी कृता ॥ ३३॥
chapter-05-shloka-34:
  devanagari: आमृत्योः स दुराचारी कालेन निधनं गतः । ययौ यमपुरं घोरं भोगस्थानं हि पापिनाम् ॥ ३४॥
chapter-05-shloka-35:
  devanagari: तत्र भुक्त्वा स दुष्टात्मा नरकानि बहूनि च । इदानीं स पिशाचोऽस्ति विन्ध्येऽद्रौ पापभुक् खलः ॥ ३५॥
chapter-05-shloka-36:
  devanagari: तस्याग्रे परमां पुण्यां सर्वपापविनाशिनीम् । दिव्यां शिवपुराणस्य कथां कथय यत्नतः ॥ ३६॥
chapter-05-shloka-37:
  devanagari: द्रुतं शिवपुराणस्य कथाश्रवणतः परात् । सर्वपापविशुद्धात्मा हास्यति प्रेततां च सः ॥ ३७॥
chapter-05-shloka-38:
  devanagari: मुक्तं च दुर्गतेस्तं वै बिन्दुगं त्वं पिशाचकम् । मदाज्ञया विमानेन समानय शिवान्तिकम् ॥ ३८॥
chapter-05-shloka-39:
  devanagari: सूत उवाच । इत्यादिष्टो महेशान्या गन्धर्वेन्द्रश्च तुम्बुरुः । मुमुदेऽतीव मनसि भाग्यं निजमवर्णयत् ॥ ३९॥
chapter-05-shloka-40:
  devanagari: आरुह्य सुविमानं स सत्या तत्प्रियया सह । ययौ विन्ध्याचले सोऽरं यत्रास्ते नारदप्रियः ॥ ४०॥
chapter-05-shloka-41:
  devanagari: तत्रापश्यत् पिशाचं तं महाकायं महाहनुम् । प्रहसन्तं रुदन्तं च वल्गन्तं विकटाकृतिम् ॥ ४१॥
chapter-05-shloka-42:
  devanagari: बलाज्जग्राह तं पाशैः पिशाचं चातिभीकरम् । तुम्बुरुश्शिवसत्कीर्तिगायकश्च महाबली ॥ ४२॥
chapter-05-shloka-43:
  devanagari: अथो शिवपुराणस्य वाचनार्थं स तुम्बुरुः । निश्चित्य रचनां चक्रे महोत्सवसमन्विताम् ॥ ४३॥
chapter-05-shloka-44:
  devanagari: पिशाचं तारितुं देव्याः शासनात्तुम्बुरुर्गतः । विन्ध्यं शिवपुराणं स ह्यद्रिं श्रावयितुं परम् ॥ ४४॥
chapter-05-shloka-45:
  devanagari: इति कोलाहलो जातः सर्वलोकेषु वै महान् । तत्र तच्छ्रवणार्थाय ययुर्देवर्षयो द्रुतम् ॥ ४५॥
chapter-05-shloka-46:
  devanagari: समाजस्तत्र परमोऽद्भुतश्चासीच्छुभावहः । तेषां शिवपुराणस्यागतानां श्रोतुमादरात् ॥ ४६॥
chapter-05-shloka-47:
  devanagari: पिशाचमथ तं पाशैर्बद्ध्वा समुपवेश्य च । तुम्बुरुर्वल्लकीहस्तो जगौ गौरीपतेः कथाम् ॥ ४७॥
chapter-05-shloka-48:
  devanagari: आरभ्य संहितामाद्यां सप्तमीसंहितावधि । स्पष्टं शिवपुराणं हि समाहात्म्यं समावदत् ॥ ४८॥
chapter-05-shloka-49:
  devanagari: श्रुत्वा शिवपुराणं तु सप्तसंहितमादरात् । बभूवुः सुकृतार्थास्ते सर्वे श्रोतार एव हि ॥ ४९॥
chapter-05-shloka-50:
  devanagari: स पिशाचो महापुण्यं श्रुत्वा शिवपुराणकम् । विधूय कलुषं सर्वं जहौ पैशाचिकं वपुः ॥ ५०॥
chapter-05-shloka-51:
  devanagari: दिव्यरूपो बभूवाशु गौरवर्णः सितांशुकः । सर्वालङ्कारदीप्ताङ्गस्त्रिनेत्रश्चन्द्रशेखरः ॥ ५१॥
chapter-05-shloka-52:
  devanagari: दिव्यं दिव्यवपुर्भूत्वा तया स निजकान्तया । जगौ स्वयमपि श्रीमांश्चरितं पार्वतीपतेः ॥ ५२॥
chapter-05-shloka-53:
  devanagari: तद्वधूमिति सन्दृष्ट्वा सर्वे देवर्षयश्च ते । बभूवुर्विस्मिताश्चित्ते परमानन्दसम्युताः ॥ ५३॥
chapter-05-shloka-54:
  devanagari: सुकृतार्था महेशस्य श्रुत्वा चरितमद्भुतम् । स्वं स्वं धाम ययुः प्रीत्या शंसन्तः शाङ्करं यशः ॥ ५४॥
chapter-05-shloka-55:
  devanagari: बिन्दुगः सोऽपि दिव्यात्मा सुविमानस्थितः सुखी । स्वकान्तापार्श्वगः श्रीमाञ्छुशुभेऽतीव खस्थितः ॥ ५५॥
chapter-05-shloka-56:
  devanagari: अथ गायन् महेशस्य सुगुणान् सुमनोहरान् । सतुम्बुरुर्जगामाशु सकान्तः शाङ्करं पदम् ॥ ५६॥
chapter-05-shloka-57:
  devanagari: सुसत्कृतो महेशेन पार्वत्या च स बिन्दुगः । स्वगणश्च कृतः प्रीत्या साभवद्गिरिजासखी ॥ ५७॥
chapter-05-shloka-58:
  devanagari: तस्मिँल्लोके परानन्दे घनज्योतिषि शाश्वते । लब्ध्वा निवासमचलं लभेते परमं सुखम् ॥ ५८॥
chapter-05-shloka-59:
  devanagari: इत्येतत् कथितं पुण्यमितिहासमघापहम् । शिवाशिवपरानन्दं निर्मलं भक्तिवर्धनम् ॥ ५९॥
chapter-05-shloka-60:
  devanagari: य इदं श‍ृणुयाद्भक्त्या कीर्तयेद्वा समाहितः । स भुक्त्वा विपुलान् भोगानन्ते मुक्तिमवाप्नुयात् ॥ ६०॥
chapter-05-shloka-61:
  devanagari: इति श्रीस्कान्दे महापुराणे शिवपुराणमाहात्म्ये बिन्दुगसद्गतिवर्णनं नाम पञ्चमोऽध्यायः ॥ ०.५॥
chapter-06-shloka-01:
  devanagari: शौनक उवाच । सूत सूत महाप्राज्ञ व्यासशिष्य नमोऽस्तु ते । धन्यस्त्वं शैववर्योऽसि वर्णनीयमहद्गुणः ॥ १॥
chapter-06-shloka-02:
  devanagari: श्रीमच्छिवपुराणस्य श्रवणस्य विधिं वद । येन सर्वं लभेच्छ्रोता सम्पूर्णं फलमुत्तमम् ॥ २॥
chapter-06-shloka-03:
  devanagari: सूत उवाच । अथ ते सम्प्रवक्ष्यामि सम्पूर्णफलहेतवे । विधिं शिवपुराणस्य शौनक श्रवणे मुने ॥ ३॥
chapter-06-shloka-04:
  devanagari: दैवज्ञं च समाहूय सन्तोष्य च जनान्वितः । मुहूर्तं शोधयेच्छुद्धं निर्विघ्नेन समाप्तये ॥ ४॥
chapter-06-shloka-05:
  devanagari: वार्ता प्रेष्या प्रयत्नेन देशे देशे च सा शुभा । भविष्यति कथा शैवी आगन्तव्यं शुभार्थिभिः ॥ ५॥
chapter-06-shloka-06:
  devanagari: दुरे हरिकथाः केचिद् दुरे शङ्करकीर्तनाः । स्त्रियः शूद्रादयो ये च बोधस्तेषां भवेद्यतः ॥ ६॥
chapter-06-shloka-07:
  devanagari: देशे देशे शाम्भवा ये कीर्तनश्रवणोत्सुकाः । तेषामानयनं कार्यं तत्प्रकारार्थमादरात् ॥ ७॥
chapter-06-shloka-08:
  devanagari: भविष्यति समाजोऽत्र साधूनां परमोत्सवः । पारायणे पुराणस्य शैवस्य परमाद्भुतः ॥ ८॥
chapter-06-shloka-09:
  devanagari: श्रीमच्छिवपुराणाह्वरसपानाय चादरात् । आयान्त्वरं भवन्तश्च कृपया प्रेमतत्पराः ॥ ९॥
chapter-06-shloka-10:
  devanagari: नावकाशो यदि प्रेम्णागन्तव्यं दिनमेककम् । सर्वथागमनं कार्यं दुर्लभा च क्षणस्थितिः ॥ १०॥
chapter-06-shloka-11:
  devanagari: तेषामाह्वानमेवं हि कार्यं सविनयं मुदा । आगतानां च तेषां हि सर्वथा कार्य आदरः ॥ ११॥
chapter-06-shloka-12:
  devanagari: शिवालये च तीर्थे वा वने वापि गृहेऽथवा । कार्यं शिवपुराणस्य श्रवणस्थलमुत्तमम् ॥ १२॥
chapter-06-shloka-13:
  devanagari: कार्यं संशोधनं भूमेर्लेपनं धातुमण्डनम् । विचित्रा रचना दिव्या महोत्सवपुरस्सरम् ॥ १३॥
chapter-06-shloka-14:
  devanagari: गृहोपस्करमुद्धृत्य निखिलं तदयोग्यकम् । एकान्ते गृहकोणे चादृश्ये यत्नान्निवेशयेत् ॥ १४॥
chapter-06-shloka-15:
  devanagari: कर्तव्यो मण्डपोऽत्युच्चैः कदलीस्तम्भमण्डितः । फलपुष्पादिभिस्सम्यग्विष्वग्वैतानराजितः ॥ १५॥
chapter-06-shloka-16:
  devanagari: चतुर्द्दिक्षु ध्वजारोपस्सपताकः सुशोभनः । सुभक्तिः सर्वथा कार्या सर्वानन्दविधायिनी ॥ १६॥
chapter-06-shloka-17:
  devanagari: सङ्कल्प्यमासनं दिव्यं शङ्करस्य परात्मनः । वक्तुश्चापि तथा दिव्यमासनं सुखसाधनम् ॥ १७॥
chapter-06-shloka-18:
  devanagari: श्रोतॄणां कल्पनीयानि सुस्थलानि यथार्हतः । अन्येषां च स्थलान्येव साधारणतया मुने ॥ १८॥
chapter-06-shloka-19:
  devanagari: विवाहे यादृशं चित्तं तादृशं कार्यमेव हि । अन्या चिन्ता विनिर्वार्या सर्वा शौनक लौकिकी ॥ १९॥
chapter-06-shloka-20:
  devanagari: उदङ्मुखो भवेद्वक्ता श्रोता प्राग्वदनस्तथा । व्युत्क्रमः पादयोर्ज्ञेयो विरोधो नास्ति कश्चनः ॥ २०॥
chapter-06-shloka-21:
  devanagari: अथवा पूर्वदिग्ज्ञेया पूज्यपूजकमध्यतः । अथवा सम्मुखे वक्तुः श्रोतॄणामाननं स्मृतम् ॥ २१॥
chapter-06-shloka-22:
  devanagari: व्यासासनसमारूढो यदा पौराणिको द्विजः । असमाप्तौ प्रसङ्गस्य नमस्कुर्यान्न कस्यचित् ॥ २२॥
chapter-06-shloka-23:
  devanagari: बालो युवाथ वृद्धो वा दरिद्रो वापि दुर्बलः । पुराणज्ञः सदा वन्द्यः पूज्यश्च सुकृतार्थिभिः ॥ २३॥
chapter-06-shloka-24:
  devanagari: नीचबुद्धिं न कुर्वीत पुराणज्ञे कदाचन । यस्य वक्त्रोद्गता वाणी कामधेनुः शरीरिणाम् ॥ २४॥
chapter-06-shloka-25:
  devanagari: गुरवः सन्ति बहवो जन्मतो गुणतश्च वै । परो गुरुः पुराणज्ञस्तेषां मध्ये विशेषतः ॥ २५॥
chapter-06-shloka-26:
  devanagari: भवकोटिसहस्रेषु भूत्वा भूत्वावसीदताम् । यो ददाति परां मुक्तिं कोऽन्यस्तस्मात् परो गुरुः ॥ २६॥
chapter-06-shloka-27:
  devanagari: पुराणज्ञः शुचिर्दक्षः शान्तो विजितमत्सरः । साधुः कारुण्यवान् वाग्मी वदेत् पुण्यकथामिमाम् ॥ २७॥
chapter-06-shloka-28:
  devanagari: आसूर्योदयमारभ्य सार्धत्रिप्रहरान्तकम् । कथा शिवपुराणस्य वाच्या सम्यक् सुधीमता ॥ २८॥
chapter-06-shloka-29:
  devanagari: ये धूर्ता ये च दुर्वृत्ता ये चान्ये विजिगीषवः । तेषां कुटिलवृत्तीनामग्रे नैव वदेत् कथाम् ॥ २९॥
chapter-06-shloka-30:
  devanagari: न दुर्जनसमाकीर्णे न तु दस्युसमावृते । देशे न धूर्तसदने वदेत् पुण्यकथामिमाम् ॥ ३०॥
chapter-06-shloka-31:
  devanagari: कथाविरामः कर्तव्यो मध्यान्हे हि मुहूर्तकम् । मलमूत्रोत्सर्जनार्थं तत्कथाकीर्तनान्नरैः ॥ ३१॥
chapter-06-shloka-32:
  devanagari: वक्त्रा क्षौरं हि सङ्कार्यं दिनादर्वाग्व्रताप्तये । कार्यं सङ्क्षेपतो नित्यकर्म सर्वं प्रयत्नतः ॥ ३२॥
chapter-06-shloka-33:
  devanagari: वक्तुः पार्श्वे सहायार्थमन्यः स्थाप्यस्तथाविधः । पण्डितः संशयच्छेत्ता लोकबोधनतत्परः ॥ ३३॥
chapter-06-shloka-34:
  devanagari: कथाविघ्नविनाशार्थं गणनाथं प्रपूजयेत् । कथाधीशं शिवं भक्त्या पुस्तकं च विशेषतः ॥ ३४॥
chapter-06-shloka-35:
  devanagari: कथां शिवपुराणस्य श‍ृणुयादादरात्सुधीः । श्रोता सुविधिना शुद्धः शुद्धचित्तः प्रसन्नधीः ॥ ३५॥
chapter-06-shloka-36:
  devanagari: अनेककर्मविभ्रान्तः कामादिषड्विकारवान् । स्त्रैणः पाखण्डवादी च वक्ता श्रोता न पुण्यभाक् ॥ ३६॥
chapter-06-shloka-37:
  devanagari: लोकचिन्तां धनागारपुत्रचिन्तां व्युदस्य च । कथाचित्तः शुद्धमतिः स लभेत् फलमुत्तमम् ॥ ३७॥
chapter-06-shloka-38:
  devanagari: श्रद्धाभक्तिसमायुक्ता नान्यकार्येषु लालसाः । वाग्यताः शुचयोऽव्यग्राः श्रोतारः पुण्यभागिनः ॥ ३८॥
chapter-06-shloka-39:
  devanagari: अभक्ता ये कथां पुण्यां श‍ृण्वन्तीमां नराधमाः । तेषां श्रवणजं नास्ति फलं दुःखं भवे भवे ॥ ३९॥
chapter-06-shloka-40:
  devanagari: असम्पूज्य पुराणं ये यथाशक्त्या ह्युपायनैः । श‍ृण्वन्तीमां कथां मूढाः स्युर्दरिद्रा न पावनाः ॥ ४०॥
chapter-06-shloka-41:
  devanagari: कथायां कथ्यमानायां गच्छन्त्यन्यत्र ये नराः । भोगान्तरे प्रणश्यन्ति तेषां दारादिसम्पदः ॥ ४१॥
chapter-06-shloka-42:
  devanagari: सोष्णीषमस्तका ये च श‍ृण्वन्तीमां कथां नराः । तत्पुत्राश्च प्रजायन्ते पापिनः कुलदूषकाः ॥ ४२॥
chapter-06-shloka-43:
  devanagari: ताम्बूलं भक्षयन्तो ये श‍ृण्वन्तीमां कथां नराः । स्वविष्ठां खादयन्त्येतान्नरके यमकिङ्कराः ॥ ४३॥
chapter-06-shloka-44:
  devanagari: ये च तुङ्गासनारूढाः श‍ृण्वन्तीमां कथां नराः । भुक्त्वा ते नरकान् सर्वांस्ततः काका भवन्ति हि ॥ ४४॥
chapter-06-shloka-45:
  devanagari: ये वीराद्यासनारूढाः श‍ृण्वन्तीमां कथां शुभाम् । भुक्तवा ते नरकान् सर्वान्विषवृक्षा भवन्ति वै ॥ ४५॥
chapter-06-shloka-46:
  devanagari: असम्प्रणम्य वक्तारं कथां श‍ृण्वन्ति ये नराः । भुक्त्वा ते नरकान् सर्वान् भवन्त्यर्जुनपादपाः ॥ ४६॥
chapter-06-shloka-47:
  devanagari: अनातुराः शयाना ये श‍ृण्वन्तीमां कथां नराः । भुक्त्वा ते नरकान् सर्वान् भवन्त्यजगरादयः ॥ ४७॥
chapter-06-shloka-48:
  devanagari: वक्तुः समासनारूढा ये श‍ृण्वन्ति कथामिमाम् । गुरुतल्पसमं पापं प्राप्यते नारकैः सदा ॥ ४८॥
chapter-06-shloka-49:
  devanagari: ये निन्दन्ति च वक्तारं कथां चेमां सुपावनीम् । भवन्ति शुनका भुक्त्वा दुःखं जन्मशतं हि ते ॥ ४९॥
chapter-06-shloka-50:
  devanagari: कथायां वर्तमानायां दुर्वादं ये वदन्ति हि । भुक्त्वा ते नरकान् घोरान् भवन्ति गर्दभास्ततः ॥ ५०॥
chapter-06-shloka-51:
  devanagari: कदाचिन्नापि श‍ृण्वन्ति कथामेतां सुपावनीम् । भुक्त्वा ते नरकान् घोरान् भवन्ति वनसूकराः ॥ ५१॥
chapter-06-shloka-52:
  devanagari: कथायां कीर्त्यमानायां विघ्नं कुर्वन्ति ये खलाः । कोट्यब्दं नरकान् भुक्त्वा भवन्ति ग्रामसूकराः ॥ ५२॥
chapter-06-shloka-53:
  devanagari: एवं विचार्य शुद्धात्मा श्रोता वक्तृसुभक्तिमान् । कथाश्रवणहेतोर्हि भवेत् प्रीत्योद्यतः सुधीः ॥ ५३॥
chapter-06-shloka-54:
  devanagari: कथाविघ्नविनाशार्थं गणेशं पूजयेत् पुरा । नित्यं सम्पाद्य सङ्क्षेपात् प्रायश्चित्तं समाचरेत् ॥ ५४॥
chapter-06-shloka-55:
  devanagari: नवग्रहांश्च सम्पूज्य सर्वतोभद्रदैवतम् । शिवपूजोक्तविधिना पुस्तकं तत्समर्चयेत् ॥ ५५॥
chapter-06-shloka-56:
  devanagari: पूजनान्ते महाभक्त्या करौ बद्ध्वा विनीतकः । साक्षाच्छिवस्वरूपस्य पुस्तकस्य स्तुतिं चरेत् ॥ ५६॥
chapter-06-shloka-57:
  devanagari: श्रीमच्छिवपुराणाख्यः प्रत्यक्षस्त्वं महेश्वरः । श्रवणार्थं स्वीकृतोऽसि सन्तुष्टो भव वै मयि ॥ ५७॥
chapter-06-shloka-58:
  devanagari: मनोरथो मदीयोऽयं कर्तव्यः सफलस्त्वया । निर्विघ्नेन सुसम्पूर्णं कथाश्रवणमस्तु मे ॥ ५८॥
chapter-06-shloka-59:
  devanagari: भवाब्धिमग्नं दीनं मां समुद्धर भवार्णवात् । कर्मग्राहगृहीताङ्गं दासोऽहं तव शङ्कर ॥ ५९॥
chapter-06-shloka-60:
  devanagari: एवं शिवपुराणं हि साक्षाच्छिवस्वरूपकम् । स्तुत्वा दीनवचः प्रोच्य वक्तुः पूजां समारभेत् ॥ ६०॥
chapter-06-shloka-61:
  devanagari: शिवपूजोक्तविधिना वक्तारं च समर्चयेत् । सपुष्पवस्त्रभूषाभिर्धूपदीपादिनार्चयेत् ॥ ६१॥
chapter-06-shloka-62:
  devanagari: तदग्रे शुद्धचित्तेन कर्तव्यो नियमस्तदा । आसमाप्ति यथाशक्त्या धारणीयः सुयत्नतः ॥ ६२॥
chapter-06-shloka-63:
  devanagari: व्यासरूप प्रबोधाग्रय शिवशास्त्रविशारद । एतत्कथाप्रकाशेन मदज्ञानं विनाशय ॥ ६३॥
chapter-06-shloka-64:
  devanagari: वरणं पञ्चविप्राणां कार्यं वैकस्य भक्तितः । शिवपञ्चार्णमन्त्रस्य जपः कार्यश्च तैः सदा ॥ ६४॥
chapter-06-shloka-65:
  devanagari: इत्युक्तस्ते मुने भक्त्या कथाश्रवणसद्विधिः । श्रोतॄणां चैव भक्तानां किमन्यच्छ्रोतुमिच्छसि ॥ ६५॥
chapter-06-shloka-66:
  devanagari: इति श्रीस्कान्दे महापुराणे शिवपुराणमाहात्म्ये श्रवणविधिवर्णनं नाम षष्ठोऽध्यायः ॥ ०.६॥
chapter-07-shloka-01:
  devanagari: शौनक उवाच । सूत सूत महाप्राज्ञ धन्यस्त्वं शैवपुङ्गव । श्रावितेयं कथास्माकमद्भुतेयं शुभावहा ॥ १॥
chapter-07-shloka-02:
  devanagari: पुंसां शिवपुराणस्य श्रवणव्रतिनां मुने । सर्वलोकहितार्थाय दयया नियमं वद ॥ २॥
chapter-07-shloka-03:
  devanagari: सूत उवाच । नियमं श‍ृणु सद्भक्त्या पुंसां तेषां च शौनक । नियमात् सत्कथां श्रुत्वा निर्विघ्नफलमुत्तमम् ॥ ३॥
chapter-07-shloka-04:
  devanagari: पुंसां दीक्षाविहीनानां नाधिकारः कथाश्रवे । श्रोतुकामैरतो वक्तुर्दीक्षा ग्राह्या च तैर्मुने ॥ ४॥
chapter-07-shloka-05:
  devanagari: ब्रह्मचर्यमधस्सुप्तिः पत्रावल्यां च भोजनम् । कथासमाप्तौ भुक्तिं च कुर्यान्नित्यं कथाव्रती ॥ ५॥
chapter-07-shloka-06:
  devanagari: आसमाप्तपुराणं हि समुपोष्य सुशक्तिमान् । श‍ृणुयाद्भक्तितः शुद्धः पुराणं शैवमुत्तमम् ॥ ६॥
chapter-07-shloka-07:
  devanagari: घृतपानं पयःपानं कृत्वा वा श‍ृणुयात् सुखम् । फलाहारेण वा श्राव्यमेकभुक्तं न वा हि तत् ॥ ७॥
chapter-07-shloka-08:
  devanagari: एकवारं हविष्यान्नं भुञ्ज्यादेतत्कथाव्रती । सुखसाध्यं यथा स्यात्तच्छ्रवणं कार्यमेव च ॥ ८॥
chapter-07-shloka-09:
  devanagari: भोजनं सुकरं मन्ये कथासु श्रवणप्रदम् । नोपवासो वरश्चेत् स्यात् कथाश्रवणविघ्नकृत् ॥ ९॥
chapter-07-shloka-10:
  devanagari: गरिष्ठं द्विदलं दग्धं निष्पावांश्च मसूरिकाम् । भावदुष्टं पर्युषितं जग्ध्वा नित्यं कथाव्रती ॥ १०॥
chapter-07-shloka-11:
  devanagari: वार्ताकं च कलिन्दं च चिचिण्डं मूलकं तथा । कूष्माण्डं नालिकेरं च मूलं जग्ध्वा कथाव्रती ॥ ११॥
chapter-07-shloka-12:
  devanagari: पलाण्डुं लशुनं हिङ्गुं गृञ्जं मादकं हि तत् । वस्तून्यामिषसंज्ञानि वर्जयेद्यः कथाव्रती ॥ १२॥
chapter-07-shloka-13:
  devanagari: कामादिषड्विकारं च द्विजानां च विनिन्दनम् । पतिव्रतासतां निन्दां वर्जयेद्यः कथाव्रती ॥ १३॥
chapter-07-shloka-14:
  devanagari: रजस्वलां न पश्येच्च पतितान्न वदेत् कथाम् । द्विजद्विषो वेदवर्ज्यान्न वदेद्यः कथाव्रती ॥ १४॥
chapter-07-shloka-15:
  devanagari: सत्यं शौचं दयां मौनमार्जवं विनयं तथा । औदार्यं मनसश्चैव कुर्यान्नित्यं कथाव्रती ॥ १५॥
chapter-07-shloka-16:
  devanagari: निष्कामश्च सकामश्च नियमाच्छृणुयात् कथाम् । सकामः काममाप्नोति निष्कामो मोक्षमाप्नुयात् ॥ १६॥
chapter-07-shloka-17:
  devanagari: दरिद्रश्च क्षयी रोगी पापी निर्भाग्य एव च । अनपत्योऽपि पुरुषः श‍ृणुयात् सत्कथामिमाम् ॥ १७॥
chapter-07-shloka-18:
  devanagari: काकवन्ध्यादयः सप्तविधा अपि खलस्त्रियः । स्रवद्गर्भा च या नारी ताभ्यां श्राव्या कथा परा ॥ १८॥
chapter-07-shloka-19:
  devanagari: सर्वेषां श्रवणं कार्यं स्त्रीभिः पुम्भिश्च यत्नतः । एतच्छिवपुराणस्य विधिना च कथां मुने ॥ १९॥
chapter-07-shloka-20:
  devanagari: एतच्छिवपुराणस्य पारायणदिनानि वै । अत्युत्तमानि बोध्यानि कोटियज्ञसमानि च ॥ २०॥
chapter-07-shloka-21:
  devanagari: एतेषु विधिना दत्तं यदल्पमपि वस्तु हि । दिवसेषु वरिष्ठेषु तदक्षय्यफलं लभेत् ॥ २१॥
chapter-07-shloka-22:
  devanagari: एवं कृत्वा व्रतविधिं श्रुत्वेमां परमां कथाम् । परानन्दयुतः श्रीमानुद्यापनमथाचरेत् ॥ २२॥
chapter-07-shloka-23:
  devanagari: एतदुद्यापनविधिश्चतुर्दश्याः समो मतः । कार्यस्तद्वद्धनाढ्यैश्च तदुक्तफलकाङ्क्षिभिः ॥ २३॥
chapter-07-shloka-24:
  devanagari: अकिञ्चनेषु भक्तेषु प्रायो नोद्यापनग्रहः । श्रवणेनैव पूतास्ते निष्कामाः शाम्भवा मताः ॥ २४॥
chapter-07-shloka-25:
  devanagari: एवं शिवपुराणस्य पारायणमखोत्सवे । समाप्ते श्रोतृभिर्भक्त्या पूजा कार्या प्रयत्नतः ॥ २५॥
chapter-07-shloka-26:
  devanagari: शिवपूजनवत् सम्यक् पुस्तकस्य पुरो मुने । पूजा कार्या सुविधिना वक्तुश्च तदनन्तरम् ॥ २६॥
chapter-07-shloka-27:
  devanagari: पुस्तकाच्छादनार्थं हि नवीनं चासनं शुभम् । समर्चयेद् दृढं दिव्यं बन्धनार्थं च सूत्रकम् ॥ २७॥
chapter-07-shloka-28:
  devanagari: पुराणार्थं प्रयच्छन्ति ये सूत्रं वसनं नवम् । भोगिनो ज्ञानसम्पन्नास्ते भवन्ति भवे भवे ॥ २८॥
chapter-07-shloka-29:
  devanagari: वक्त्रे दद्यान्महार्हाणि वस्तूनि विविधानि च । वस्त्रभूषणपात्राणि दिव्यं बहु विशेषतः ॥ २९॥
chapter-07-shloka-30:
  devanagari: आसनार्थं प्रयच्छन्ति पुराणस्य च ये नराः । कम्बलाजिनवासांसि मञ्चं फलकमेव च ॥ ३०॥
chapter-07-shloka-31:
  devanagari: स्वर्गलोकं समासाद्य भुक्त्वा भोगान् यथेप्सितान् । स्थित्वा ब्रह्मपदे कल्पं यान्ति शैवपदं ततः ॥ ३१॥
chapter-07-shloka-32:
  devanagari: एवं कृत्वा विधानेन पुस्तकस्य प्रपूजनम् । वक्तुश्च मुनिशार्दूल महोत्सवपुरस्सरम् ॥ ३२॥
chapter-07-shloka-33:
  devanagari: सहायार्थं स्थापितस्य पण्डितस्य प्रपूजनम् । कुर्यात्तदनुसारेण किञ्चिदूनं धनादिभिः ॥ ३३॥
chapter-07-shloka-34:
  devanagari: समागतेभ्यो विप्रेभ्यो दद्यादन्नं धनादिकम् । महोत्सवः प्रकर्तव्यो गीतैर्वाद्यैश्च नर्तनैः ॥ ३४॥
chapter-07-shloka-35:
  devanagari: विरक्तश्च भवेच्छ्रोता परेऽहनि विशेषतः । गीता वाच्या शिवेनोक्ता रामचन्द्राय या मुने ॥ ३५॥
chapter-07-shloka-36:
  devanagari: गृहस्थश्चेद्भवेच्छ्रोता कर्तव्यस्तेन धीमता । होमः शुद्धेन हविषा कर्मणस्तस्य शान्तये ॥ ३६॥
chapter-07-shloka-37:
  devanagari: रुद्रसंहितया होमः प्रतिश्लोकेन वा मुने । गायत्र्यास्तन्मयत्वाच्च पुराणस्यास्य तत्त्वतः ॥ ३७॥
chapter-07-shloka-38:
  devanagari: अथवा मूलमन्त्रेण पञ्चवर्णेन शैवतः । होमाशक्तौ बुधो हौम्यं हविर्दद्याद् द्विजाय तत् ॥ ३८॥
chapter-07-shloka-39:
  devanagari: दोषयोः प्रशमार्थं च न्यूनताधिकताख्ययोः । पठेच्च श‍ृणुयाद्भक्त्या शिवनामसहस्रकम् ॥ ३९॥
chapter-07-shloka-40:
  devanagari: तेन स्यात् सफलं सर्वं सफलं नात्र संशयः । यतो नास्त्यधिकं त्वस्मात् त्रैलोक्ये वस्तु किञ्चन ॥ ४०॥
chapter-07-shloka-41:
  devanagari: एकादशमितान् विप्रान् भोजयेन्मधुपायसैः । दद्यात् तेभ्यो दक्षिणां च व्रतपूर्णत्वसिद्धये ॥ ४१॥
chapter-07-shloka-42:
  devanagari: शक्तौ पलत्रयमितस्वर्णेन सुन्दरं मुने । सिंहं विधाय तत्रास्य पुराणस्य शुभाक्षरम् ॥ ४२॥
chapter-07-shloka-43:
  devanagari: लेखितं लिखितं वापि संस्थाप्य विधिना पुमान् । सम्पूज्यावाहनाद्यैश्च ह्युपचारैः सदक्षिणम् ॥ ४३॥
chapter-07-shloka-44:
  devanagari: वस्त्रभूषणगन्धाद्यैः पूजिताय यतात्मने । आचार्याय सुधीर्दद्याच्छिवसन्तोषहेतवे ॥ ४४॥
chapter-07-shloka-45:
  devanagari: तेन दानप्रभावेण पुराणस्यास्य शौनक । सम्प्राप्यानुग्रहं शैवं मुक्तः स्याद्भवबन्धनात् ॥ ४५॥
chapter-07-shloka-46:
  devanagari: एवं कृते विधाने च श्रीमच्छिवपुराणकम् । सम्पूर्णफलदं स्याद्वै भुक्तिमुक्तिप्रदायकम् ॥ ४६॥
chapter-07-shloka-47:
  devanagari: इति ते कथितं सर्वं किं भूयः श्रोतुमिच्छसि । श्रीमच्छिवपुराणस्य माहात्म्यं सर्वकामदम् ॥ ४७॥
chapter-07-shloka-48:
  devanagari: श्रीमच्छिवपुराणं तु पुराणतिलकं स्मृतम् । महच्छिवप्रियं रम्यं भवरोगनिवारणम् ॥ ४८॥
chapter-07-shloka-49:
  devanagari: ते जन्मभाजः खलु जीवलोके ये वै सदा ध्यायन्ति विश्वनाथम् । वाणी गुणान् स्तौति कथां श‍ृणोति श्रोत्रद्वयं ते भवमुत्तरन्ति ॥ ४९॥
chapter-07-shloka-50:
  devanagari: सकलगुणविभेदैर्नित्यमस्पष्टरूपं जगति च बहिरन्तर्भासमानं महिम्ना । मनसि च बहिरन्तर्वाङ्मनोवृत्तिरूपं परमशिवमनन्तानन्दसान्द्रं प्रपद्ये ॥ ५०॥
chapter-07-shloka-51:
  devanagari: इति श्रीस्कान्दे महापुराणे सनत्कुमारसंहितायां श्रीशिवपुराणश्रवणव्रतिनां विधिनिषेधपुस्तकवक्तृपूजनवर्णनं नाम सप्तमोऽध्यायः ॥ ०.७॥
chapter-07-shloka-52:
  devanagari: ॥ श्रीशिवमहापुराणमाहात्म्य सम्पूर्णम् ॥
