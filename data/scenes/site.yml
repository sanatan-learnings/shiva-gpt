scenes:
  cover:
    title: Site Cover
    description: |
      Home hero for Shiva (Shaivism) – devotional website cover with calm sacred atmosphere and clear branding.

      Create a clean, iconic composition with subtle Shaivism symbolism (e.g., trident motifs, soft divine glow) in a warm saffron + spiritual blue palette.
      Keep it landscape-friendly for a 16:9 homepage hero; avoid clutter and leave gentle negative space for potential title overlay.
