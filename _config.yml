title: "Shiva GPT"
description: "Verse collection project powered by Sanatan Verse SDK"

# GitHub Pages project site: site lives at https://<org>.github.io/<repo>/
# Required so /images/... and assets resolve under the repo path, not site root.
url: "https://sanatan-learnings.github.io"
baseurl: "/shiva-gpt"
banner_title: "Shiva GPT"
banner_subtitle: "Sacred verses & guided study"
home_hero_subtitle_en: "Ask questions, explore verses, and deepen your devotional study with guided AI support."
home_hero_subtitle_hi: "प्रश्न पूछें, श्लोकों का अध्ययन करें और मार्गदर्शित AI के साथ अपनी साधना को गहरा बनाएं।"
project_repository_url: "https://github.com/sanatan-learnings/shiva-gpt"
usage_guide_url: "#"
ask_shiva_url: "#"
search_verses_url: "#"
shiva_quiz_url: "#"
contribute_url: "#"
markdown: kramdown
collections:
  verses:
    output: true
    permalink: /:path/
plugins:
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
      type: verses
    values:
      layout: verse
exclude:
  - README.md
  - venv/
  - .venv/
